name: traffic stats

# GitHub keeps clone and view traffic for 14 days only. This job saves it daily
# to CSV files on the orphan `stats` branch so the history outlives that window.
#
# The traffic API needs a token with push access to the repo, which the default
# GITHUB_TOKEN does not have for this endpoint. TRAFFIC_STATS_TOKEN must be a
# fine-grained token scoped to this repo with "Administration: read".
#
# traffic.csv holds one row per day. Each run rewrites the days still in the
# 14-day window, so the partial count for the current day is corrected the
# next day. referrers.csv appends a snapshot of the top referrers, which GitHub
# only reports as a 14-day total.

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  archive:
    name: 📈 Archive Traffic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Switch to the stats branch
        run: |
          if git fetch --depth=1 origin stats; then
            git checkout -B stats FETCH_HEAD
          else
            git checkout --orphan stats
            git rm -rfq .
          fi

      - name: Fetch and merge traffic
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_STATS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/traffic/clones" > "$RUNNER_TEMP/clones.json"
          gh api "repos/$REPO/traffic/views" > "$RUNNER_TEMP/views.json"
          gh api "repos/$REPO/traffic/popular/referrers" > "$RUNNER_TEMP/referrers.json"

          header='date,clones,clone_uniques,views,view_uniques'
          jq -r -n \
            --slurpfile c "$RUNNER_TEMP/clones.json" \
            --slurpfile v "$RUNNER_TEMP/views.json" '
            ($c[0].clones | map({key: .timestamp[:10], value: .}) | from_entries) as $cm
            | ($v[0].views | map({key: .timestamp[:10], value: .}) | from_entries) as $vm
            | ($cm + $vm | keys[]) as $d
            | [$d, ($cm[$d].count // 0), ($cm[$d].uniques // 0),
                   ($vm[$d].count // 0), ($vm[$d].uniques // 0)]
            | map(tostring) | join(",")' > "$RUNNER_TEMP/new.csv"

          # New rows come last, so after tac the first row seen per date wins.
          {
            echo "$header"
            { tail -n +2 traffic.csv 2>/dev/null || true; cat "$RUNNER_TEMP/new.csv"; } \
              | tac | awk -F, '!seen[$1]++' | sort
          } > traffic.tmp
          mv traffic.tmp traffic.csv

          # Replace today's snapshot if the job already ran today.
          today="$(date -u +%F)"
          [ -f referrers.csv ] || echo 'snapshot_date,referrer,count,uniques' > referrers.csv
          grep -v "^\"$today\"," referrers.csv > referrers.tmp || true
          mv referrers.tmp referrers.csv
          jq -r --arg d "$today" \
            '.[] | [$d, .referrer, .count, .uniques] | @csv' \
            "$RUNNER_TEMP/referrers.json" >> referrers.csv

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add traffic.csv referrers.csv
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -qm "chore(stats): archive traffic for $(date -u +%F)"
          git push origin stats
